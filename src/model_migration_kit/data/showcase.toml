# Thresholds and judges for the seeded showcase report.
#
# The showcase is the fourteen-night document a stranger reads first. It is
# generated by `scripts/showcase.py` against a checkout; nothing a user of this
# package runs reads this file, and it has no accessor in `__init__.py` for the
# same reason `showcase_goldenset.jsonl` has none. It lives beside that set
# because a rubric is resolved relative to the config that declares it, and the
# three files the showcase is measured with should travel together.
#
# It exists rather than standing in behind `demo.toml`, whose numbers are
# currently identical, for two reasons. Every band in `scripts/showcase.py`'s
# docstring -- the 432-442 REVIEW window, the 931 further runs, the p-values --
# is computed at the thresholds below, and a later edit to the demo's gate would
# silently re-band a published document nobody would think to re-measure. And a
# judge takes its model id from `spec.model`, so under `demo.toml` the showcase's
# judge ran as `fake-judge-v1`: a name saying "demo" in the provenance footer of
# a document about the showcase.

[[judge]]
name = "accuracy"

# Pinned (`opik_rigor.pinning.is_pinned`), so the panel builds a real
# `PinnedJudge` over it, and synthetic in the same word as the four models the
# seed scripts. `scripts/showcase.py`'s JUDGE_MODEL_ID states the same string and
# `_check_scripts` refuses the pair if they ever disagree.
model = "synthetic-judge-v1"

# Not `demo_rubric.md`. That document covers reference answers and refusals and
# has no summarisation rule at all, while its hash is recorded on every verdict
# and rendered in the provenance footer -- so declaring it would attest the
# showcase's summarisation grading to a document that does not contain it.
# `showcase_rubric.md` carries the split the judge actually applies.
rubric = "showcase_rubric.md"

# No `adapter` key, as in `demo.toml`: the driver supplies the judge's adapter
# itself, and `"fake"` is not a value a config may declare.

[thresholds]
# The bar a candidate's pass rate must clear, as a Wilson lower bound rather than
# an observed rate. At 96 items x 5 draws = 480 completions per side this puts
# the REVIEW band at 432-442 passing completions, which is the window night 6's
# candidate C lands in.
pass_rate_floor = 0.90

# One-sided; an improvement is not a regression. Night 6's Mann-Whitney p is
# roughly five times this, which is the margin the seed was sized for.
alpha = 0.05
confidence = 0.95

# A judge that cannot parse its own model's answers more than this often
# invalidates every number downstream of it, so the run aborts instead. Written
# down rather than left to the default for the same reason as the rest: a default
# that moves would move a published document with it.
judge_failure_tolerance = 0.05

# The regression the showcase promises to be able to notice: a ten-point drop in
# pass rate. At 480 completions per side the regression test needs 67-150, so
# rule 4's power warning never fires here and every REVIEW in the document is a
# rule 3 -- the bar was missed and more completions may clear it.
min_detectable_effect = 0.10
power_target = 0.80
