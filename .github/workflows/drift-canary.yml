# Weekly dependency drift canary.
#
# CI (ci.yml) tests what users get today: opik-rigor pinned to >=0.2,<0.3. This job
# tests what users will get after the next `pip install --upgrade` -- the latest
# opik-rigor, ignoring our own upper bound. It exists so that a breaking release is
# found by us on a Monday, not by a user on a Friday.
#
# The bound above is read from pyproject.toml at run time, not from this comment --
# the mechanism was unaffected when the floor moved from >=0.1.0,<0.2 to >=0.2,<0.3
# on 2026-08-14. The comment lagged by three days anyway, which is worth noting
# because this paragraph is the file's orientation for whoever reads it next.
#
# Only opik-rigor is tracked here. This project has no Opik dependency of its own --
# deps are opik-rigor, jinja2, rich and tomli -- so the Opik drift surface belongs
# entirely to rigor's canary. That canary did not exist when this sentence was
# written; it does now (opik-rigor/.github/workflows/drift-canary.yml, 2026-08-17),
# and it watches the rigor->Opik and rigor->migkit edges from the other side.
#
# THIS WORKFLOW'S PASS/FAIL MEANS "IS THE CANARY HEALTHY", NOT "IS THERE DRIFT".
#   green + no issue  -> latest works, nothing to do
#   green + an issue  -> DRIFT. Read the issue; it names the versions and the failures.
#   red               -> the canary itself could not run (index down, yanked release,
#                        network). Fix the job. Says nothing about compatibility.
# Drift never turns this red, so the red channel stays scarce and therefore readable.

name: Drift canary

on:
  schedule:
    # 06:17 UTC Monday. Off the hour on purpose: GitHub drops scheduled runs that
    # queue up at :00, and a canary that silently stops running is the exact failure
    # this job exists to prevent.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # Never cancel a canary mid-run: a cancelled run is classified as neither drift nor
  # broken, which is worse than either answer.
  group: drift-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: latest opik-rigor / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # A weekly job with no ceiling can hang on a stalled index and hold a runner for
    # the six-hour default. On a weekly cadence that is indistinguishable from a
    # canary that stopped firing, which is the failure the schedule comment above
    # already calls out.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling, not the whole matrix. 3.10 is where a dependency
        # raising its requires-python bites first; 3.13 is where a new C extension
        # fails to build first. The middle versions add runtime, not coverage.
        python-version: ["3.10", "3.13"]
    # No `outputs:` here, deliberately. A matrix job has ONE set of outputs and every
    # cell writes to it, so the surviving value is whichever cell happened to finish
    # last. That is not a cosmetic race: a clean 3.13 landing after a drifting 3.10
    # would hand `report` the string "clean", and `clean` is the one status that
    # CLOSES the drift issue -- so the canary would find a real incompatibility and
    # then delete its own report of it. Each cell writes a verdict file instead and
    # `report` reads all of them, where drift outranks clean regardless of order.
    env:
      # Same invariant as ci.yml: the suite is green with no provider credentials.
      # It is also what makes a stage-4 failure unambiguous -- there is no network in
      # the test path, so a failing test cannot be a flake.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --- Stage 1: what IS the latest? -------------------------------------------
      # Failure here is always a broken canary: we never got far enough to learn
      # anything about compatibility. A yanked release counts as broken too -- testing
      # against a withdrawn version tells us nothing and would file a bogus issue.
      - name: Resolve latest versions
        id: resolve
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, time, urllib.request

          def fetch(pkg):
              url = f"https://pypi.org/pypi/{pkg}/json"
              err = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return json.load(r)
                  except Exception as exc:  # noqa: BLE001 - any failure is "index unreachable"
                      err = exc
                      # Back off between attempts. Three retries fired back-to-back all
                      # complete inside a second and all lose to the same blip, which
                      # makes the retry decorative -- and a five-second outage then
                      # reddens the canary and reads as if the job needed fixing.
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))
              print(f"::error::Could not reach PyPI for {pkg}: {err}", file=sys.stderr)
              raise SystemExit(1)

          out = {}
          for pkg in ("opik-rigor",):
              data = fetch(pkg)
              version = data["info"]["version"]
              files = data["releases"].get(version) or []
              if files and all(f.get("yanked") for f in files):
                  print(f"::error::{pkg} {version} is yanked. Not a compatibility "
                        f"signal -- the canary has nothing valid to test against.",
                        file=sys.stderr)
                  raise SystemExit(1)
              out[pkg] = version

          print(f"versions={json.dumps(out)}")
          print(f"rigor={out['opik-rigor']}")
          PY

      # --- Stage 2: can it even be installed? -------------------------------------
      # The one ambiguous stage, split by reading pip's own diagnosis rather than
      # guessing. A resolver refusal is a real compatibility fact a user would hit --
      # most concretely, latest opik-rigor raising requires-python above our 3.10
      # floor. A timeout is just a timeout.
      - name: Install at latest
        id: install
        continue-on-error: true
        env:
          RIGOR: ${{ steps.resolve.outputs.rigor }}
        run: |
          set +e
          python -m pip install --upgrade pip

          # The pinned baseline, installed first so the upgrade below has something to
          # upgrade. Its failure is a BROKEN canary, never drift: we never reached the
          # question this job asks, and what it would have failed on is the bound
          # ci.yml already tests. Left unchecked, this fell through to a suite that
          # then failed on a missing pytest and got filed as a rigor incompatibility.
          python -m pip install -e ".[dev]" 2>&1 | tee baseline.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "outcome=broken" >> "$GITHUB_OUTPUT"
            echo "detail=the pinned baseline install failed, so the latest was never tested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log=install.log
          for attempt in 1 2 3; do
            echo "--- upgrade attempt $attempt ---"
            python -m pip install --upgrade "opik-rigor==$RIGOR" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            [ "$rc" -eq 0 ] && break
            grep -qiE "resolutionimpossible|no matching distribution|requires a different python" "$log" && break
            sleep $(( attempt * 20 ))
          done

          if [ "$rc" -eq 0 ]; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
          elif grep -qiE "resolutionimpossible|no matching distribution|requires a different python" "$log"; then
            # A user running `pip install --upgrade` would hit exactly this.
            echo "outcome=drift" >> "$GITHUB_OUTPUT"
            echo "detail=install refused: $(grep -iEm1 'resolutionimpossible|no matching distribution|requires a different python' "$log")" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=broken" >> "$GITHUB_OUTPUT"
            echo "detail=pip failed 3x with no resolver error (network/index)" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # --- Stage 3: did the upgrade actually take? --------------------------------
      # Guards against the quietest failure available: an install that no-ops, leaving
      # the pinned version in place, so the suite passes and the canary reports green
      # having tested nothing. The version assertion is the whole point of this step.
      - name: Preflight
        id: preflight
        if: steps.install.outputs.outcome == 'ok'
        continue-on-error: true
        env:
          # Read from the environment rather than interpolated into the source: the
          # value is a string PyPI chose, and a quote or a backslash in it would be a
          # SyntaxError in this heredoc rather than a version mismatch.
          RIGOR: ${{ steps.resolve.outputs.rigor }}
        run: |
          python - <<'PY'
          import os, sys
          import opik_rigor
          want = os.environ["RIGOR"]
          got = opik_rigor.__version__
          print(f"opik_rigor {got} (wanted {want})")
          if got != want:
              print(f"::error::upgrade did not take: still on {got}")
              sys.exit(1)
          PY

      # --- Stage 4: does it still work? -------------------------------------------
      # continue-on-error is load-bearing, not defensive: it is the single line that
      # guarantees drift can never turn this workflow red.
      - name: Test against latest
        id: suite
        if: steps.install.outputs.outcome == 'ok'
        continue-on-error: true
        # This step used to say the demo was "knowingly broken until Session 3, so
        # including it would report drift every week from day one." Session 3 shipped
        # it; the sentence outlived the condition it described. The demo is now the
        # more valuable of the two signals here, because it is the only thing that
        # runs a rigor verdict end to end -- `assert_pass_rate` -> NO-GO -> exit 1 --
        # and rigor's one breaking change to date (0.2.0 refusing `confidence <= 0.5`)
        # is exactly the shape that reaches a caller through that path rather than
        # through a unit test's own fixtures.
        #
        # Packaging is deliberately NOT tested here: this job installs `-e .`, so the
        # demo can read its golden set from the repo root. ci.yml's demo job builds a
        # wheel for that reason and is the one that would catch a data file missing
        # from the distribution. This job asks one question -- does latest rigor still
        # produce the same verdict -- and answers it in the cheapest install.
        run: |
          set +e
          python -m pytest -q
          suite=$?
          # Exit 1 is the demo PASSING: it exists to show the tool refusing an unsafe
          # migration. 0=GO 1=NO-GO 2=REVIEW 3=error. Asserted exactly, because a GO
          # or a REVIEW under latest rigor is precisely the drift this job hunts, and
          # `|| true` would swallow it along with a crash.
          migkit demo --out demo-report.html
          demo=$?
          set -e
          echo "pytest exit=$suite   migkit demo exit=$demo (1 = NO-GO = correct)"
          if [ "$demo" -ne 1 ]; then
            echo "::error::migkit demo exited $demo; expected 1 (NO-GO)."
            echo "::error::0=GO 1=NO-GO 2=REVIEW 3=error. Under latest opik-rigor the"
            echo "::error::bundled demo no longer demonstrates a caught regression."
          fi
          # `steps.suite.outcome` is one bit and this step now asks two questions, so
          # name the failing one for the issue body. Every value interpolated here is
          # an exit code this job captured, not text from an index.
          case "$suite:$demo" in
            0:1) ;;
            0:*) echo "failed=the bundled demo returned $demo, not 1 (NO-GO)" >> "$GITHUB_OUTPUT" ;;
            *:1) echo "failed=the offline suite failed" >> "$GITHUB_OUTPUT" ;;
            *)   echo "failed=the offline suite failed, and the demo returned $demo, not 1 (NO-GO)" >> "$GITHUB_OUTPUT" ;;
          esac
          # Both run before either can fail the step, so one broken signal never hides
          # the other from whoever reads the log.
          [ "$suite" -eq 0 ] && [ "$demo" -eq 1 ]

      - name: Classify
        id: classify
        if: always()
        # Every untrusted value arrives as an environment variable and is read as
        # `$VAR`, never expanded into the script by `${{ }}`. DETAIL is a line lifted
        # out of pip's stderr -- text this repository does not author -- and pasting
        # that between the quotes of an `echo` makes an index's error message
        # executable in a job that holds a token.
        env:
          OUTCOME: ${{ steps.install.outputs.outcome }}
          DETAIL: ${{ steps.install.outputs.detail }}
          RIGOR: ${{ steps.resolve.outputs.rigor }}
          PYVER: ${{ matrix.python-version }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          SUITE_FAILED: ${{ steps.suite.outputs.failed }}
        run: |
          {
            echo "### Drift canary — py$PYVER"
            echo
            echo "- opik-rigor: \`${RIGOR:-unresolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          emit() { printf 'status=%s\n' "$1" >> "$GITHUB_OUTPUT"
                   printf 'detail=%s\n' "$2" >> "$GITHUB_OUTPUT"; }

          case "$OUTCOME" in
            broken) emit broken "$DETAIL" ;;
            drift)  emit drift  "$DETAIL" ;;
            ok)
              if [ "$PREFLIGHT" != "success" ]; then
                emit drift "installed, but the upgrade did not take or the package is unimportable"
              elif [ "$SUITE" != "success" ]; then
                # No retry and no heuristics: the suite is offline and key-free by
                # invariant 3, so a failure here cannot be a flake. The fallback text
                # covers the step dying before it could name a signal -- killed by the
                # job timeout, say -- which leaves `SUITE_FAILED` empty.
                emit drift "${SUITE_FAILED:-stage 4 failed without naming a signal} on py$PYVER"
              else
                emit clean ""
              fi ;;
            *)
              # Reached when the install step produced no outcome at all -- it was
              # killed by a timeout or the runner, and `continue-on-error` swallowed
              # that. Without this branch `status` stayed empty, the fail step below
              # never fired, and `report` read the empty string as "not drift" and
              # closed the open issue. A silent green is the one result this workflow
              # exists to make impossible.
              emit broken "the install step ended without classifying itself (outcome='$OUTCOME')" ;;
          esac

      # Filed before the fail step below, so a broken cell still reports itself.
      - name: File this cell's verdict
        if: always()
        env:
          PYVER: ${{ matrix.python-version }}
          STATUS: ${{ steps.classify.outputs.status }}
          DETAIL: ${{ steps.classify.outputs.detail }}
          VERSIONS: ${{ steps.resolve.outputs.versions }}
        run: |
          mkdir -p verdicts
          python3 - <<'PY'
          import json, os, pathlib
          status = os.environ.get("STATUS") or "broken"
          verdict = {
              "python": os.environ["PYVER"],
              # An absent status means Classify never ran -- the job died before it.
              # Unknown is not clean, and must never be able to close a drift issue.
              "status": status,
              "detail": os.environ.get("DETAIL") or "",
              "versions": os.environ.get("VERSIONS") or "",
          }
          path = pathlib.Path("verdicts") / f"py{verdict['python']}.json"
          path.write_text(json.dumps(verdict), encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-verdict-py${{ matrix.python-version }}
          path: verdicts/
          retention-days: 14

      # The ONLY path that reddens this workflow. Drift cannot reach it.
      - name: Fail the run only if the canary itself is broken
        if: always() && steps.classify.outputs.status == 'broken'
        env:
          DETAIL: ${{ steps.classify.outputs.detail }}
        run: |
          echo "::error::Canary broken: $DETAIL"
          echo "::error::This says nothing about compatibility. Fix the job, then re-run."
          exit 1

  report:
    name: report drift
    runs-on: ubuntu-latest
    needs: canary
    timeout-minutes: 10
    # Runs even when a matrix cell failed, so a broken 3.10 cell cannot suppress a
    # drift report from the 3.13 cell.
    if: always() && needs.canary.result != 'cancelled'
    permissions:
      # `issues: write` is what `gh issue list/create/comment/edit/close` needs and
      # is the whole reason this job is separate; `contents: read` is the floor.
      # Nothing here checks out or writes code. Downloading this run's own artifacts
      # goes through the Actions runtime token, not GITHUB_TOKEN, so it needs no
      # `actions:` scope -- do not add one.
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: drift-canary
      MARKER: "<!-- canary-key: latest-opik-rigor -->"
      # STATUS/DETAIL/VERSIONS are set on the reconcile step, not here: job-level
      # `env` is evaluated before any step runs and cannot see the `steps` context.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Collect every cell's verdict
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: canary-verdict-*
          merge-multiple: true
          path: verdicts

      - name: Reduce the cells to one verdict
        id: verdicts
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json

          cells = [json.load(open(f, encoding="utf-8"))
                   for f in sorted(glob.glob("verdicts/*.json"))]

          if not cells:
              # No cell got far enough to file anything. The canary job is already red
              # and says so; `unknown` is deliberately neither `drift` (do not open an
              # issue on no evidence) nor `clean` (do not close one, either).
              print("status=unknown")
              print("detail=no cell filed a verdict")
              print("versions=")
              raise SystemExit(0)

          drift = [c for c in cells if c["status"] == "drift"]
          broken = [c for c in cells if c["status"] not in ("drift", "clean")]
          versions = next((c["versions"] for c in cells if c["versions"]), "")

          def name(cells):
              return "; ".join(
                  f"py{c['python']}: {c['detail'] or 'no detail recorded'}" for c in cells)

          if drift:
              # Drift outranks clean and outranks broken. `clean` -- the only status
              # that closes the issue -- requires every cell to have said so.
              status, detail = "drift", name(drift)
              if broken:
                  detail += f" (and {', '.join('py' + c['python'] for c in broken)} could not be tested)"
          elif broken:
              status, detail = "broken", name(broken)
          else:
              status, detail = "clean", ""

          # One line, bounded. A step output is newline-delimited, so a detail string
          # carrying a newline out of pip's stderr would forge the outputs after it.
          print(f"status={status}")
          print("detail=" + " ".join(detail.split())[:400])
          print(f"versions={versions}")
          PY

      # Reconcile a single issue rather than filing one per run. Identity comes from
      # the label plus the marker in the body, never from the title, so retitling by
      # hand does not orphan the issue and cause a duplicate.
      - name: Reconcile the drift issue
        env:
          STATUS: ${{ steps.verdicts.outputs.status }}
          DETAIL: ${{ steps.verdicts.outputs.detail }}
          VERSIONS: ${{ steps.verdicts.outputs.versions }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)

          # `gh issue create --label` fails outright on a label the repo does not have
          # ("could not add label: 'drift-canary' not found"), and nothing has ever
          # created this one -- the canary has never run. So the first genuine drift
          # report would have died here, on the single run where it mattered, and the
          # red would have read as a broken canary rather than as the drift it was.
          # Idempotent, and cheap enough to just do every run.
          gh label create "$LABEL" --repo "$REPO" --force \
            --color FBCA04 \
            --description "Filed by .github/workflows/drift-canary.yml" >/dev/null 2>&1 || true

          existing=$(gh issue list --repo "$REPO" \
            --label "$LABEL" --state open --json number,body --jq '.[0] // empty')
          number=$(printf '%s' "$existing" | jq -r '.number // empty')
          oldbody=$(printf '%s' "$existing" | jq -r '.body // empty')

          if [ "$STATUS" != "drift" ]; then
            # Clean (or the canary was broken, which is reported by the red run, not
            # here). Close any open drift issue -- self-healing beats a stale yellow light.
            if [ -n "$number" ] && [ "$STATUS" = "clean" ]; then
              gh issue comment "$number" --repo "$REPO" \
                --body "Resolved. The suite is green against $VERSIONS as of $today. [Run]($RUN_URL)"
              gh issue close "$number" --repo "$REPO"
            fi
            exit 0
          fi

          body=$(cat <<EOF
          $MARKER

          The weekly canary ran the offline suite and the bundled `migkit demo`
          against the **latest** published opik-rigor instead of our pinned bound, and
          it did not pass.

          | | |
          |---|---|
          | Versions tested | \`$VERSIONS\` |
          | What happened | $DETAIL |
          | Last checked | **$today** |
          | Run | [$RUN_URL]($RUN_URL) |

          This is a yellow signal. \`main\` is green and users on the pinned bound are
          fine; the CI badge is untouched. What it means is that raising the upper bound
          today would break them.

          Next: reproduce locally with the versions above, then either fix the
          incompatibility and raise the bound, or record why the bound stays where it is
          in \`COMPATIBILITY.md\`.

          This issue is maintained by \`.github/workflows/drift-canary.yml\`. It is
          edited in place each week (no comment, no notification) and closes itself when
          the canary goes green. A stale \`Last checked\` date means the schedule stopped
          firing -- GitHub disables cron workflows after 60 days of repo inactivity.
          EOF
          )

          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" \
              --title "Drift: latest opik-rigor fails the suite" \
              --label "$LABEL" --body "$body"
            exit 0
          fi

          # Comment ONLY when the version set changed. A new version that still breaks
          # is new information and deserves a notification; the same version breaking
          # for the 40th week is not, and 52 "still broken" comments bury the one
          # comment that mattered.
          if ! printf '%s' "$oldbody" | grep -qF "$VERSIONS"; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing, against new versions: \`$VERSIONS\` — $DETAIL. [Run]($RUN_URL)"
          fi
          gh issue edit "$number" --repo "$REPO" --body "$body"
