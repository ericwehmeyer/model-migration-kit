[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-migration-kit"
# The version is NOT written here. See [tool.hatch.version] at the bottom of this
# file: hatchling reads `__version__` out of src/model_migration_kit/__init__.py,
# which makes that assignment the only place the number exists. Two copies of a
# version number is a bug waiting for the worst possible moment -- the copy a user
# quotes when filing a bug is `__version__`, and the copy the index serves is this
# one, so a disagreement is invisible to everybody who could fix it.
dynamic = ["version"]
description = "Statistically defensible go/no-go verdicts for LLM model migrations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "E. Wehmeyer" }]
keywords = ["llm", "evaluation", "migration", "regression", "testing", "opik"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  # The whole point: every statistical primitive is imported, none reimplemented.
  "opik-rigor>=0.1.0,<0.2",
  "jinja2>=3.0",
  "rich>=13.0",
  # tomllib arrived in the stdlib in 3.11, and this floor is 3.10 -- which CI
  # actually runs, so the gap is not theoretical. The marker means 3.11+ installs
  # nothing extra, and the config loader does `try: import tomllib / except
  # ImportError: import tomli as tomllib` rather than branching on sys.version.
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The provider SDKs. Neither is a runtime dependency: opik-rigor imports them
# lazily inside the first sampling call, so every keyless path -- `migkit demo`,
# `--adapter fake`, and the whole test suite -- runs without either installed, and
# making them mandatory would put a provider's HTTP client on the machine of
# everybody who only ever wanted the demo.
#
# They are declared as extras rather than left undeclared because the README's
# documented real-model path names `--adapter anthropic`, and following the Install
# section exactly used to leave a reader one undeclared package short of it. Worse,
# they found out at *grading* time, after both runs were already sampled -- which
# sat badly beside the README's claim that the pin rule is checked "before a single
# API call is spent". `cli._require_sdk` now checks at adapter construction, and
# this is the line its error message tells you to install.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.scripts]
migkit = "model_migration_kit.cli:main"

[project.urls]
Homepage = "https://github.com/ericwehmeyer/model-migration-kit"
Repository = "https://github.com/ericwehmeyer/model-migration-kit"
Issues = "https://github.com/ericwehmeyer/model-migration-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/model_migration_kit"]

# The single source of the version. `[project] dynamic = ["version"]` above tells
# the build backend the number is not in this file; this tells it where it is.
# hatchling parses the `__version__ = "..."` assignment out of the file as text --
# it does not import the package, so nothing here depends on the runtime
# dependencies being installed at build time.
#
# The bump is therefore one edit to one line in __init__.py, in its own commit
# alongside the CHANGELOG section for that version.
[tool.hatch.version]
path = "src/model_migration_kit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` is deliberately NOT here. pytest's verbosity is a signed counter: addopts
# `-q` sets it to -1, a `-q` on the command line adds another, and at -2 pytest
# stops printing the "N passed" summary line altogether. So `pytest -q` -- the
# thing everybody types -- printed progress dots and then nothing, and two people
# independently worked around it with `-o addopts=...` before anyone noticed why.
# Leaving the flag to the caller means `pytest` and `pytest -q` both end in a count,
# which is the number every checklist in docs/ asks to be pasted as evidence.
addopts = "--strict-markers"
markers = [
  # Every marker here must be applied by at least one test --
  # tests/test_import_purity.py asserts it. `--strict-markers` above bans applying a
  # marker that is not declared; that test bans declaring one that is not applied.
  # A `requires_network` marker used to sit here, deselected by `-m "not
  # requires_network"` in ci.yml and drift-canary.yml, and carried by no test in the
  # suite -- a flag that deselected nothing while reading as the promise that CI
  # never touches a provider. The promise is kept elsewhere and for real: both
  # workflows blank ANTHROPIC_API_KEY and OPENAI_API_KEY and then run everything.
  # Re-adding it is one line, in the commit that adds the first test to carry it.
  "slow: test takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["model_migration_kit"]
branch = true
