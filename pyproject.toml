[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-migration-kit"
# The version is NOT written here. See [tool.hatch.version] at the bottom of this
# file: hatchling reads `__version__` out of src/model_migration_kit/__init__.py,
# which makes that assignment the only place the number exists. Two copies of a
# version number is a bug waiting for the worst possible moment -- the copy a user
# quotes when filing a bug is `__version__`, and the copy the index serves is this
# one, so a disagreement is invisible to everybody who could fix it.
dynamic = ["version"]
description = "Statistically defensible go/no-go verdicts for LLM model migrations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "E. Wehmeyer" }]
keywords = ["llm", "evaluation", "migration", "regression", "testing", "opik"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  # The whole point: every statistical primitive is imported, none reimplemented.
  "opik-rigor>=0.1.0,<0.2",
  "jinja2>=3.0",
  "rich>=13.0",
  # tomllib arrived in the stdlib in 3.11, and this floor is 3.10 -- which CI
  # actually runs, so the gap is not theoretical. The marker means 3.11+ installs
  # nothing extra, and the config loader does `try: import tomllib / except
  # ImportError: import tomli as tomllib` rather than branching on sys.version.
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.scripts]
migkit = "model_migration_kit.cli:main"

[project.urls]
Homepage = "https://github.com/ericwehmeyer/model-migration-kit"
Repository = "https://github.com/ericwehmeyer/model-migration-kit"
Issues = "https://github.com/ericwehmeyer/model-migration-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/model_migration_kit"]

# The single source of the version. `[project] dynamic = ["version"]` above tells
# the build backend the number is not in this file; this tells it where it is.
# hatchling parses the `__version__ = "..."` assignment out of the file as text --
# it does not import the package, so nothing here depends on the runtime
# dependencies being installed at build time.
#
# The bump is therefore one edit to one line in __init__.py, in its own commit
# alongside the CHANGELOG section for that version.
[tool.hatch.version]
path = "src/model_migration_kit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "requires_network: test needs a live provider endpoint (deselected by default in CI)",
  "slow: test takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["model_migration_kit"]
branch = true
